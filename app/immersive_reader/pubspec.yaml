name: immersive_reader
description: A cross-platform reading app that teaches German through progressive word replacement while reading English documents.
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdf: ^34.1.31 # Updated library for PDF text extraction and viewing
  archive: ^3.6.1                  # Manual DOCX/EPUB zip/XML parsing (docx_to_text/epubx conflict with syncfusion's xml version)
  path: ^1.9.1
  sqflite: ^2.4.3
  # sqflite's own platform-channel implementation only covers Android/iOS/
  # macOS (via sqflite_darwin) - Windows and Linux have no native backend at
  # all, so this is a real runtime dependency (main() wires it in as the
  # databaseFactory on those platforms), not just an in-memory test double.
  sqflite_common_ffi: ^2.3.3
  file_picker: ^8.0.0
  shared_preferences: ^2.3.2       # Per-document scroll position persistence
  http: ^1.2.0                     # Phase 3: fetch vocabulary from the backend API
  flutter_tts: ^4.2.0              # German pronunciation playback for replaced words
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: 2.7.3

# msix's published pubspec.yaml misdeclares itself as a native Windows
# plugin to current Flutter tooling, breaking `flutter run`/`build windows`
# - see vendor/README.md for the full explanation. Drop this override if a
# future msix release fixes it upstream.
dependency_overrides:
  msix:
    path: vendor/msix

flutter:
  uses-material-design: true
  assets:
    - assets/vocab/

# Windows installer packaging (`dart run msix:create`) - see
# packaging/windows/README.md. Unsigned/test-signed for now; real code
# signing is a separate, still-open TODO item (unsigned .msix/.exe gets
# SmartScreen-blocked on another machine, but this still produces a real,
# installable package for local testing).
msix_config:
  display_name: Immersive Reader
  publisher_display_name: Immersive Reader
  identity_name: com.immersivereader.app
  publisher: CN=ImmersiveReaderDev
  logo_path: packaging/windows/app_icon.png
  msix_version: 1.0.0.0
  capabilities: internetClient
  languages: en-us, de-de
