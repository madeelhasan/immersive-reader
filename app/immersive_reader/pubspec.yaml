name: immersive_reader
description: A cross-platform reading app that teaches German through progressive word replacement while reading English documents.
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdf: ^34.1.31 # Updated library for PDF text extraction and viewing
  archive: ^3.6.1                  # Manual DOCX/EPUB zip/XML parsing (docx_to_text/epubx conflict with syncfusion's xml version)
  path: ^1.9.1
  sqflite: ^2.4.3
  file_picker: ^8.0.0
  shared_preferences: ^2.3.2       # Per-document scroll position persistence
  http: ^1.2.0                     # Phase 3: fetch vocabulary from the backend API
  flutter_tts: ^4.2.0              # German pronunciation playback for replaced words

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3        # In-memory SQLite for testing LocalDb/WordProgressRepository (no plugin channel in widget tests)

flutter:
  uses-material-design: true
  assets:
    - assets/vocab/
